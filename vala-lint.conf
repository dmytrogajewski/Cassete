[Checks]
block-opening-brace-space-before=error
double-semicolon=error
double-spaces=error
ellipsis=error
line-length=error
naming-convention=error
no-space=error
note=off
space-before-paren=error
use-of-tabs=error
trailing-newlines=error
trailing-whitespace=error
unnecessary-string-template=error

[Disabler]
disable-by-inline-comments=true

[line-length]
max-line-length=120
ignore-comments=false

[naming-convention]
exceptions=UUID,inStyleTabs,Tape.YaMAPI.Landing.InStyle.inStyleTabs

[note]
keywords=TODO,FIXME

[file-exclude]
paths=src/widgets/test-shader.vala,src/widgets/vibe-canvas.vala,subprojects/libtape/lib/ya-m-api/objects/landing/in-style.vala
