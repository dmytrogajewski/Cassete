name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build artifacts image
        run: docker build --build-arg APP_VERSION=${{ steps.version.outputs.version }} --target artifacts -t cassette-artifacts .

      - name: Extract native artifacts
        run: |
          container_id=$(docker create cassette-artifacts)
          docker cp "$container_id":/dist "${{ github.workspace }}/docker-dist"
          docker rm "$container_id"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cassette-native
          path: docker-dist/**

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine build version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: cassette-native
          path: build-release/native

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cassette-${{ github.ref_name }}
          path: build-release/native/**

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/native/**
          generate_release_notes: true

