app-id: space.rirusha.Cassette
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: cassette
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --filesystem=xdg-music
  - --filesystem=xdg-download
modules:
  - name: cassette
    buildsystem: meson
    config-opts:
      - -Dis_devel=false
      - -Dtests=false
    sources:
      - type: dir
        path: ..

